services:
  postgres:
    image: postgres:16-alpine
    container_name: study-helper-db
    environment:
      POSTGRES_DB: study_helper
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5445:5432"
    volumes:
      - study_helper_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d study_helper"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - study-helper-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: study-helper-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/study_helper
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8093:8093"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8093/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - study-helper-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: study-helper-frontend
    ports:
      - "4213:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - study-helper-net

volumes:
  study_helper_pgdata:
    name: study_helper_pgdata

networks:
  study-helper-net:
    driver: bridge
